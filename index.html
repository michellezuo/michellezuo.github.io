      c.setAttribute('cx', 462 + Math.random() * 276);
      c.setAttribute('cy', 150 + Math.random() * 60);
      c.setAttribute('r', 1.2 + Math.random() * 2.2);
      c.style.animationDuration = (6 + Math.random() * 8) + 's';
      c.style.animationDelay = (-Math.random() * 14) + 's';
      snow.appendChild(c);
    }

    // sink tap toggles water
    const sink = document.getElementById('sink');
    const toggle = () => {
      const on = sink.classList.toggle('on');
      sink.setAttribute('aria-pressed', on);
    };
    sink.addEventListener('click', toggle);
    sink.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  </script>
</body>
</html>
